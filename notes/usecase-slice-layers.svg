<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1672" viewBox="0 0 680 836" role="img">
  <title>ユースケース・スライス・部品と、作業の単位としての線、スプリントの束ね方</title>
  <desc>ユースケースとスライスは 1 対 N、スライスと部品は N 対 M。スライスから部品への線 1 本が作業の単位で、新規・変更・使うだけの 3 種類がある。スプリントは複数のスライスを束ね、共有する部品が無いスライスは別の担当で並行できることを示す図</desc>
  <defs>
    <style>
      text { font-family: 'Yu Gothic UI', 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
      .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .gray .th { fill: #444441; }
      .gray .ts { fill: #5F5E5A; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .purple .th { fill: #3C3489; }
      .purple .ts { fill: #534AB7; }
      .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .teal .th { fill: #085041; }
      .teal .ts { fill: #0F6E56; }
      .note { fill: #993C1D; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="836" fill="#FFFFFF"/>

  <text class="th" x="88" y="30" text-anchor="middle" dominant-baseline="central">ユースケース</text>
  <text class="th" x="285" y="30" text-anchor="middle" dominant-baseline="central">スライス（要件の層）</text>
  <text class="ts" x="285" y="50" text-anchor="middle" dominant-baseline="central">1 スプリントで縦に通す単位</text>
  <text class="th" x="415" y="62" text-anchor="middle" dominant-baseline="central">作業（線）</text>
  <text class="ts" x="415" y="80" text-anchor="middle" dominant-baseline="central">部品 × スライス</text>
  <text class="th" x="565" y="30" text-anchor="middle" dominant-baseline="central">部品（実装の層）</text>
  <text class="ts" x="565" y="50" text-anchor="middle" dominant-baseline="central">実際に作る・直すプログラム</text>

  <path d="M156 139 C182 139 182 104 206 104" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M156 139 C182 139 182 174 206 174" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M156 344 L206 344" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M360 96 C414 96 414 94 466 94" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360 104 C414 104 414 232 466 232" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360 112 C414 112 414 290 466 290" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360 174 C414 174 414 154 466 154" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360 336 C414 336 414 244 466 244" fill="none" stroke="#D85A30" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M360 344 C414 344 414 302 466 302" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M360 352 C414 352 414 376 466 376" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g class="gray">
    <rect x="20" y="115" width="136" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="88" y="130" text-anchor="middle" dominant-baseline="central">UC1</text>
    <text class="th" x="88" y="148" text-anchor="middle" dominant-baseline="central">経費を精算する</text>
  </g>
  <g class="gray">
    <rect x="20" y="320" width="136" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="88" y="335" text-anchor="middle" dominant-baseline="central">UC2</text>
    <text class="th" x="88" y="353" text-anchor="middle" dominant-baseline="central">購買を申請する</text>
  </g>

  <g class="purple">
    <rect x="210" y="80" width="150" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="285" y="95" text-anchor="middle" dominant-baseline="central">スライス 1-1</text>
    <text class="th" x="285" y="113" text-anchor="middle" dominant-baseline="central">基本の立替申請</text>
  </g>
  <g class="purple">
    <rect x="210" y="150" width="150" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="285" y="165" text-anchor="middle" dominant-baseline="central">スライス 1-2</text>
    <text class="th" x="285" y="183" text-anchor="middle" dominant-baseline="central">外貨建て申請</text>
  </g>
  <g class="purple">
    <rect x="210" y="320" width="150" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="285" y="335" text-anchor="middle" dominant-baseline="central">スライス 2-1</text>
    <text class="th" x="285" y="353" text-anchor="middle" dominant-baseline="central">基本の発注申請</text>
  </g>

  <rect x="460" y="192" width="210" height="144" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="470" y="203" dominant-baseline="central">2 つの UC から使う部品</text>

  <g class="teal">
    <rect x="470" y="70" width="190" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="565" y="85" text-anchor="middle" dominant-baseline="central">画面</text>
    <text class="th" x="565" y="103" text-anchor="middle" dominant-baseline="central">経費申請画面</text>
  </g>
  <g class="teal">
    <rect x="470" y="130" width="190" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="565" y="145" text-anchor="middle" dominant-baseline="central">API</text>
    <text class="th" x="565" y="163" text-anchor="middle" dominant-baseline="central">為替レート取得</text>
  </g>
  <g class="teal">
    <rect x="470" y="214" width="190" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="565" y="229" text-anchor="middle" dominant-baseline="central">API</text>
    <text class="th" x="565" y="247" text-anchor="middle" dominant-baseline="central">共通ワークフロー承認</text>
  </g>
  <g class="teal">
    <rect x="470" y="272" width="190" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="565" y="287" text-anchor="middle" dominant-baseline="central">DB</text>
    <text class="th" x="565" y="305" text-anchor="middle" dominant-baseline="central">申請トランザクション</text>
  </g>
  <g class="teal">
    <rect x="470" y="352" width="190" height="48" rx="6" stroke-width="1"/>
    <text class="ts" x="565" y="367" text-anchor="middle" dominant-baseline="central">画面</text>
    <text class="th" x="565" y="385" text-anchor="middle" dominant-baseline="central">購買申請画面</text>
  </g>

  <text class="th" x="183" y="428" text-anchor="middle" dominant-baseline="central">▲ ここは 1:N でシンプル</text>
  <text class="ts" x="183" y="448" text-anchor="middle" dominant-baseline="central">1 スライスは必ず 1 つの UC に属する</text>
  <text class="th note" x="415" y="428" text-anchor="middle" dominant-baseline="central">▲ ここだけ N:M になる</text>
  <text class="ts" x="415" y="448" text-anchor="middle" dominant-baseline="central">共通部品を別 UC のスライスも使う</text>

  <rect x="20" y="472" width="640" height="118" rx="8" fill="#FAFAF7" stroke="#B4B2A9" stroke-width="1"/>
  <text class="th" x="36" y="492" dominant-baseline="central">線 1 本が作業の単位（スライスのために、部品を作る・直す・使う）</text>
  <path d="M36 518 L84 518" fill="none" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text class="th" x="96" y="518" dominant-baseline="central">新規</text>
  <text class="ts" x="170" y="518" dominant-baseline="central">部品を作る。単体テストを作る</text>
  <path d="M36 544 L84 544" fill="none" stroke="#D85A30" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text class="th" x="96" y="544" dominant-baseline="central">変更</text>
  <text class="ts" x="170" y="544" dominant-baseline="central">部品に手を入れる。単体テストを足し、その部品を使うスライスのテストも流し直す</text>
  <path d="M36 570 L84 570" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="th" x="96" y="570" dominant-baseline="central">使うだけ</text>
  <text class="ts" x="170" y="570" dominant-baseline="central">呼ぶ・設定するだけ。単体テストは作らず、スライスの結合テストで確かめる</text>

  <text class="th" x="20" y="624" dominant-baseline="central">スプリント（回）＝ 複数のスライスを束ねたもの。共有する部品が無いスライスは並行できる</text>
  <rect x="100" y="640" width="270" height="176" rx="8" fill="#FAFAF7" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
  <rect x="390" y="640" width="270" height="176" rx="8" fill="#FAFAF7" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
  <text class="th" x="235" y="658" text-anchor="middle" dominant-baseline="central">スプリント 1</text>
  <text class="ts" x="235" y="676" text-anchor="middle" dominant-baseline="central">ゴール: 立替申請の基本の流れが通る</text>
  <text class="th" x="525" y="658" text-anchor="middle" dominant-baseline="central">スプリント 2</text>
  <text class="ts" x="525" y="676" text-anchor="middle" dominant-baseline="central">ゴール: 購買の流れと外貨建てが通る</text>
  <text class="ts" x="36" y="710" dominant-baseline="central">担当 A</text>
  <text class="ts" x="36" y="762" dominant-baseline="central">担当 B</text>

  <path d="M335 710 C380 710 380 762 421 762" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="235" y="762" text-anchor="middle" dominant-baseline="central">依存: 2-1 は 1-1 の作る部品を変更</text>

  <g class="purple">
    <rect x="135" y="692" width="200" height="36" rx="6" stroke-width="1"/>
    <text class="th" x="235" y="710" text-anchor="middle" dominant-baseline="central">1-1 基本の立替申請</text>
  </g>
  <g class="purple">
    <rect x="425" y="692" width="200" height="36" rx="6" stroke-width="1"/>
    <text class="th" x="525" y="710" text-anchor="middle" dominant-baseline="central">1-2 外貨建て申請</text>
  </g>
  <g class="purple">
    <rect x="425" y="744" width="200" height="36" rx="6" stroke-width="1"/>
    <text class="th" x="525" y="762" text-anchor="middle" dominant-baseline="central">2-1 基本の発注申請</text>
  </g>

  <text class="ts" x="235" y="800" text-anchor="middle" dominant-baseline="central">骨格: 業務の流れと共通部品の最初の形</text>
  <text class="ts note" x="525" y="800" text-anchor="middle" dominant-baseline="central">共有する部品が無いので並行できる</text>
</svg>
